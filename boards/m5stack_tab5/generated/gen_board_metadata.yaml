version: 1
board: m5stack_tab5
chip: esp32p4

devices:
  audio_dac:
    type: audio_codec
    peripherals:
    - i2s_audio_out
    - i2c_master

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 0
      cmd: 0
      d0: 0
      d1: 0
      d2: 0
      d3: 0
      d4: 0
      d5: 0
      d6: 0
      d7: 0

  gpio_expander:
    type: gpio_expander
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_io_expander_pi4ioe5v6408: '*'

  gpio_expander_2:
    type: gpio_expander
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_io_expander_pi4ioe5v6408: '*'

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  display_lcd:
    type: display_lcd
    sub_type: dsi
    peripherals:
    - ldo_mipi
    - dsi_display
    dependencies:
      espressif/esp_lcd_ili9881c: '*'
      espressif/esp_lcd_st7121: '*'
      espressif/esp_lcd_st7123: '*'

  touch_power_ctrl:
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - gpio_power_touch

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_lcd_touch_gt911: '*'
      espressif/esp_lcd_touch_st7123: '*'

  camera:
    type: camera
    sub_type: csi
    peripherals:
    - i2c_master
    - ldo_mipi

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 31
      scl_io_num: 32

  i2s_audio_out:
    type: i2s
    role: master
    format: tdm-out
    io:
      mclk: 30
      bclk: 27
      ws: 29
      dout: 26
      din: 28

  i2s_audio_in:
    type: i2s
    role: master
    format: tdm-in
    io:
      mclk: 30
      bclk: 27
      ws: 29
      dout: 26
      din: 28

  ldo_mipi:
    type: ldo

  dsi_display:
    type: dsi

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 22

  gpio_power_touch:
    type: gpio
    io:
      pin: 23
