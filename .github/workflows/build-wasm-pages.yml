name: Build and publish WASM examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wasm-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM examples
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Emscripten 6.0.9
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9

      - name: Fetch locked WASM components
        shell: pwsh
        run: ./fetch.ps1

      - name: Build Brookesia layout example
        shell: pwsh
        run: ./build-bb-layout.ps1 -Fresh

      - name: Build ESP-Brookesia SuperOS example
        shell: pwsh
        run: ./build-eb-superos.ps1 -Fresh

      - name: Build Brookesia-Brookesia SuperOS example
        shell: pwsh
        run: ./build-bb-superos.ps1 -Board m5stack_tab5 -Fresh

      - name: Assemble static site
        shell: pwsh
        run: ./host.ps1 -PublishOnly

      - name: Upload WASM site artifact
        uses: actions/upload-artifact@v7
        with:
          name: brookesia-wasm-site-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
